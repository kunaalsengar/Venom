<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>let’s collaborate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap">
<style>
  :root { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(120% 90% at 30% 20%, #e9e3dc 0%, #ddd8cd 60%, #d3cfc2 100%); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: none; touch-action: none; }
  #hint { position: fixed; left: 0; right: 0; bottom: 0; text-align: center;
    padding: 0 16px calc(20px + env(safe-area-inset-bottom, 0px));
    font: 500 14px/1.4 Inter, "Helvetica Neue", Arial, sans-serif; color: #6d685d;
    pointer-events: none; transition: opacity .8s; }
  #hint.off { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Bring your cursor close.</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 1, H = 1, dpr = 1;
function resize(){
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
}
addEventListener('resize', resize); resize();
if (document.fonts && document.fonts.load) document.fonts.load('700 20px Inter');

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function rr(x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---- state ----
const P = { x: 0, y: 0, vx: 0, vy: 0 };
let e = 0, engaged = false, ang = -0.1, inited = false;
let C = { x: 0, y: 0 }, lastMove = -99, started = false, hasMouse = false;
addEventListener('pointermove', ev => {
  C.x = ev.clientX; C.y = ev.clientY; hasMouse = true; lastMove = performance.now() / 1000;
  if (!started) { started = true; hint.classList.add('off'); }
});
addEventListener('pointerdown', ev => { C.x = ev.clientX; C.y = ev.clientY; hasMouse = true; lastMove = performance.now() / 1000; });

const M = 18;
const S = [];
for (let i = 0; i < M; i++){
  const r = Math.random;
  S.push({ a: r() * 6.283, rad: r() * 14, delay: r() * 0.45, tOff: (i - (M - 1) / 2) * 4.2 + (r() - .5) * 3,
    ph: r() * 6.283, f: 1.4 + r() * 2.2, bend: (r() - .5) * 2, sag: .5 + r(), w: 1.5 + r() * 1.6,
    kt: 55 + r() * 45, tx: 0, ty: 0, tvx: 0, tvy: 0, cx: 0, cy: 0, cvx: 0, cvy: 0, init: false });
}

function pillDims(){
  const w = clamp(W * 0.36, 230, 400); return { w, h: w * 0.36 };
}

function drawPill(sc, w, h){
  const hw = w / 2, hh = h / 2;
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(ang); ctx.scale(sc, sc);
  ctx.save();
  ctx.shadowColor = 'rgba(70,60,125,0.38)'; ctx.shadowBlur = 38 * dpr; ctx.shadowOffsetY = 24 * dpr;
  const g = ctx.createLinearGradient(0, -hh, 0, hh);
  g.addColorStop(0, '#24252c'); g.addColorStop(.18, '#0e0e12'); g.addColorStop(.55, '#030304');
  g.addColorStop(.9, '#08080b'); g.addColorStop(1, '#16171c');
  ctx.fillStyle = g; ctx.beginPath(); rr(-hw, -hh, w, h, hh); ctx.fill();
  ctx.restore();
  // reflections, clipped to the pill
  ctx.save(); ctx.beginPath(); rr(-hw, -hh, w, h, hh); ctx.clip();
  let g2 = ctx.createLinearGradient(-hw, 0, -hw * 0.1, 0);
  g2.addColorStop(0, 'rgba(150,180,230,.42)'); g2.addColorStop(.5, 'rgba(80,100,140,.14)'); g2.addColorStop(1, 'rgba(80,100,140,0)');
  ctx.fillStyle = g2; ctx.beginPath(); rr(-hw + 7, -hh + 7, hw * 0.95, h - 14, hh - 7); ctx.fill();
  let g3 = ctx.createLinearGradient(0, -hh, 0, 0);
  g3.addColorStop(0, 'rgba(255,255,255,.34)'); g3.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g3; ctx.beginPath(); ctx.ellipse(-hw * 0.05, -hh * 0.52, hw * 0.78, hh * 0.42, 0, 0, 6.283); ctx.fill();
  ctx.save(); ctx.translate(hw * 0.62, -hh * 0.42); ctx.rotate(-0.22);
  let g4 = ctx.createLinearGradient(-hw * .22, 0, hw * .22, 0);
  g4.addColorStop(0, 'rgba(255,255,255,0)'); g4.addColorStop(.5, 'rgba(255,255,255,.5)'); g4.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g4; ctx.beginPath(); ctx.ellipse(0, 0, hw * .22, hh * .13, 0, 0, 6.283); ctx.fill(); ctx.restore();
  const bx = clamp(0.15 + P.vx * 0.0006, -0.6, 0.7) * hw;
  let g5 = ctx.createLinearGradient(bx - 45, 0, bx + 45, 0);
  g5.addColorStop(0, 'rgba(255,255,255,0)'); g5.addColorStop(.5, 'rgba(255,255,255,.10)'); g5.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g5; ctx.fillRect(bx - 45, -hh, 90, h);
  let g6 = ctx.createLinearGradient(0, -hh, 0, hh);
  g6.addColorStop(0, 'rgba(255,255,255,0)'); g6.addColorStop(.7, 'rgba(255,255,255,0)'); g6.addColorStop(1, 'rgba(255,255,255,.2)');
  ctx.strokeStyle = g6; ctx.lineWidth = 3; ctx.beginPath(); rr(-hw + 1.5, -hh + 1.5, w - 3, h - 3, hh - 1.5); ctx.stroke();
  ctx.restore();
  let g7 = ctx.createLinearGradient(0, -hh, 0, hh);
  g7.addColorStop(0, 'rgba(255,255,255,.5)'); g7.addColorStop(.35, 'rgba(255,255,255,.04)'); g7.addColorStop(1, 'rgba(255,255,255,.14)');
  ctx.strokeStyle = g7; ctx.lineWidth = 1.4; ctx.beginPath(); rr(-hw, -hh, w, h, hh); ctx.stroke();
  // label
  const fs = h * 0.36;
  ctx.font = '700 ' + fs + 'px Inter, "Helvetica Neue", Arial, sans-serif';
  if ('letterSpacing' in ctx) ctx.letterSpacing = (-fs * 0.035) + 'px';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let gt = ctx.createLinearGradient(0, -fs / 2, 0, fs / 2);
  gt.addColorStop(0, '#f6f5f0'); gt.addColorStop(1, '#c9c7bf');
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 3 * dpr; ctx.fillStyle = gt;
  ctx.fillText('let\u2019s collaborate', 0, h * 0.02);
  ctx.restore();
}

function drawHand(x, y, s, a){
  if (a < 0.01) return;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x + 5 * s, y); ctx.scale(s, s);
  const shapes = [[-8, 0, 6, 22, 3], [-2, 9, 5.5, 14, 2.8], [3.5, 11, 5.5, 13, 2.8], [9, 13, 5, 12, 2.5], [-8, 14, 22, 15, 6], [-13.5, 17, 8, 10, 4]];
  ctx.lineJoin = 'round'; ctx.strokeStyle = '#0a0a0c'; ctx.lineWidth = 3.2;
  ctx.beginPath(); shapes.forEach(a => rr(a[0], a[1], a[2], a[3], a[4])); ctx.stroke();
  ctx.fillStyle = '#e9e4da'; ctx.beginPath(); shapes.forEach(a => rr(a[0], a[1], a[2], a[3], a[4])); ctx.fill('nonzero');
  ctx.lineWidth = 1.1; ctx.strokeStyle = 'rgba(10,10,12,.55)';
  ctx.beginPath(); ctx.moveTo(-2, 12); ctx.lineTo(-2, 22); ctx.moveTo(3.5, 14); ctx.lineTo(3.5, 22); ctx.moveTo(9, 16); ctx.lineTo(9, 22); ctx.stroke();
  ctx.restore();
}
function drawArrow(x, y, a){
  if (a < 0.01) return;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 17); ctx.lineTo(4.2, 13.2); ctx.lineTo(7, 19.5);
  ctx.lineTo(9.6, 18.4); ctx.lineTo(6.8, 12.2); ctx.lineTo(12, 12); ctx.closePath();
  ctx.fillStyle = '#0a0a0c'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.3; ctx.stroke(); ctx.fill(); ctx.restore();
}

let prev = performance.now() / 1000;
function frame(){
  const now = performance.now() / 1000;
  const dt = Math.min(now - prev, 1 / 30); prev = now;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const { w, h } = pillDims(), sc0 = w / 300;
  const home = { x: W / 2, y: H * 0.46 };
  if (!inited){ P.x = home.x; P.y = home.y; C.x = W * 0.9; C.y = H * 0.55; inited = true; }

  // cursor: real pointer, or a ghost demo before anyone touches the page
  if (!hasMouse || now - lastMove > 7){
    const t = now - 1.0;
    if (t > 0){ C.x = W * 0.5 + Math.cos(t * 0.55) * W * 0.3; C.y = H * 0.62 + Math.sin(t * 0.8) * H * 0.2; }
    else { C.x = W * 0.9; C.y = H * 0.55; }
  }
  const dx0 = C.x - P.x, dy0 = C.y - P.y, d = Math.hypot(dx0, dy0);
  const Rin = Math.max(320, w * 1.5), Rout = Rin * 1.7;
  if (!engaged && d < Rin) engaged = true;
  if (engaged && d > Rout) engaged = false;
  e += ((engaged ? 1 : 0) - e) * (1 - Math.exp(-(engaged ? 5 : 3) * dt));

  // pill gets pulled toward the cursor, hangs above it
  const sc = (1 + 0.1 * e) * 1;
  const offY = h * 0.5 * sc + 150 * sc0;
  const gx = clamp(C.x, w * 0.5, W - w * 0.5), gy = clamp(C.y - offY, h * 0.8, H - h);
  const Tx = home.x + (gx - home.x) * e * 0.9, Ty = home.y + (gy - home.y) * e * 0.9;
  P.vx += ((Tx - P.x) * 16 - P.vx * 6.5) * dt; P.vy += ((Ty - P.y) * 16 - P.vy * 6.5) * dt;
  P.x += P.vx * dt; P.y += P.vy * dt;
  ang = -0.1 + clamp((C.x - P.x) / W * 0.4, -0.22, 0.22) * e + clamp(P.vx * 0.0003, -0.1, 0.1);

  // strand anchors: where the pill edge faces the cursor
  const ux = dx0 / (d || 1), uy = dy0 / (d || 1);
  const ca = Math.cos(-ang), sa = Math.sin(-ang);
  const lx = ux * ca - uy * sa, ly = ux * sa + uy * ca;
  const hw = w / 2 * sc, hh = h / 2 * sc;
  const k = Math.pow(Math.pow(Math.abs(lx / hw), 4) + Math.pow(Math.abs(ly / hh), 4), 0.25) || 1;
  const bx = lx / k * 0.92, by = ly / k * 0.92, tgx = -ly, tgy = lx;
  const cr = Math.cos(ang), sr = Math.sin(ang);

  const sub = 2, hdt = dt / sub;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const s of S){
    const ax0 = bx + tgx * s.tOff * sc0, ay0 = by + tgy * s.tOff * sc0;
    const Ax = P.x + ax0 * cr - ay0 * sr, Ay = P.y + ax0 * sr + ay0 * cr;
    const rt = (s.rad + 4) * sc0;
    const ttx = C.x + Math.cos(s.a) * rt, tty = C.y + Math.sin(s.a) * rt;
    if (!s.init){ s.tx = Ax; s.ty = Ay; s.cx = Ax; s.cy = Ay; s.init = true; }
    const ext = sstep(s.delay, s.delay + 0.55, e);
    const ex = Ax + (s.tx - Ax) * ext, ey = Ay + (s.ty - Ay) * ext;
    const L = Math.hypot(ex - Ax, ey - Ay) || 1;
    const px = -(ey - Ay) / L, py = (ex - Ax) / L;
    const wob = reduce ? 0 : Math.sin(now * s.f + s.ph) * s.bend * L * 0.17;
    const ctx_ = (Ax + ex) / 2 + px * wob, cty_ = (Ay + ey) / 2 + py * wob + L * 0.12 * s.sag * e;
    for (let n = 0; n < sub; n++){
      const kc = s.kt, cd = 2 * Math.sqrt(kc) * (reduce ? 0.9 : 0.34);
      s.tvx += ((ttx - s.tx) * kc - s.tvx * cd) * hdt; s.tvy += ((tty - s.ty) * kc - s.tvy * cd) * hdt;
      s.tx += s.tvx * hdt; s.ty += s.tvy * hdt;
      s.cvx += ((ctx_ - s.cx) * 38 - s.cvx * 7) * hdt; s.cvy += ((cty_ - s.cy) * 38 - s.cvy * 7) * hdt;
      s.cx += s.cvx * hdt; s.cy += s.cvy * hdt;
    }
    if (ext < 0.02) continue;
    const NS = 20;
    let x0 = Ax, y0 = Ay;
    ctx.strokeStyle = 'rgba(8,8,10,0.93)';
    for (let j = 1; j <= NS; j++){
      const t = j / NS, u = 1 - t;
      let X = u * u * Ax + 2 * u * t * s.cx + t * t * ex, Y = u * u * Ay + 2 * u * t * s.cy + t * t * ey;
      if (!reduce){ const rp = Math.sin(t * 9 - now * 7 + s.ph) * 2.6 * e * t * u * 4; X += px * rp; Y += py * rp; }
      ctx.lineWidth = Math.max(0.7, s.w * (1 - 0.62 * t)) * (0.75 + 0.25 * sc0);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(X, Y); ctx.stroke();
      x0 = X; y0 = Y;
    }
  }

  drawPill(sc, w, h);
  drawArrow(C.x, C.y, 1 - sstep(0.25, 0.55, e));
  drawHand(C.x, C.y, 1.15 * Math.max(sc0, 0.9), sstep(0.5, 0.85, e));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
