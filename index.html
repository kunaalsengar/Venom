<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLACK MATTER</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap">
<style>
  :root { box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }

  html, body {
    margin: 0;
    min-height: 100%;
    overflow-x: hidden;
    background: radial-gradient(120% 90% at 30% 20%, #e9e3dc 0%, #ddd8cd 60%, #d3cfc2 100%);
    background-attachment: fixed;
    font-family: Inter, "Helvetica Neue", Arial, sans-serif;
  }

  /* Full-viewport fixed canvas keeps the portrait stage centered across resize & scroll */
  canvas#c {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    touch-action: none;
  }

  #hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    text-align: center;
    padding: 0 16px calc(22px + env(safe-area-inset-bottom, 0px));
    font: 500 14px/1.4 Inter, "Helvetica Neue", Arial, sans-serif;
    color: #6d685d;
    pointer-events: none;
    transition: opacity 0.8s ease;
    z-index: 3;
  }
  #hint.off { opacity: 0; }

  /* Graceful fallback shown only if Canvas 2D or required image assets fail to load */
  #fallback {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 32px;
    text-align: center;
    color: #4f4b43;
    z-index: 4;
  }
  #fallback[hidden] { display: none; }
  #fallback img {
    max-width: min(86vw, 540px);
    max-height: 78vh;
    width: auto;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 24px 60px rgba(32, 28, 38, 0.22), 0 6px 18px rgba(24, 22, 28, 0.12);
    display: block;
  }
  #fallback p {
    margin: 0;
    font-size: 14px;
    color: #6d685d;
  }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Portrait photograph stage"></canvas>
<div id="hint">Move your cursor over the portrait.</div>
<div id="fallback" hidden>
  <img id="fallback-img" alt="Portrait photograph" hidden>
  <p id="fallback-msg"></p>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
